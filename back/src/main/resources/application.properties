spring.application.name=back

# Import Secret Configuration
spring.config.import=optional:classpath:application-secret.properties

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/noticeflow?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
spring.datasource.username=${db.username}
spring.datasource.password=${db.password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# OAuth2 Google Configuration
spring.security.oauth2.client.registration.google.client-id=${oauth2.google.client-id}
spring.security.oauth2.client.registration.google.client-secret=${oauth2.google.client-secret}
spring.security.oauth2.client.registration.google.scope=profile,email
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}

# JWT Configuration
jwt.secret=${jwt.secret}
jwt.expiration=3600000
jwt.refresh-expiration=604800000

app.oauth2.redirect-uri=http://localhost:5173/oauth2/redirect

# Logging Configuration
logging.level.com.noticeflow.back=INFO
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG
